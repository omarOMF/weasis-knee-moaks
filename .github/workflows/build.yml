name: Build plugin (outline version)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  WEASIS_VERSION: 4.8.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the plugin code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Get Weasis ${{ env.WEASIS_VERSION }}
        uses: actions/checkout@v5
        with:
          repository: nroduit/Weasis
          ref: v${{ env.WEASIS_VERSION }}
          path: weasis

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the Weasis modules the plugin uses
        working-directory: weasis
        run: >
          mvn -B -ntp install -DskipTests
          -Drevision=${{ env.WEASIS_VERSION }} -Dchangelist=
          -pl weasis-dicom/weasis-dicom-viewer2d -am

      - name: Check the scoring model and CSV files
        working-directory: plugin
        run: |
          mkdir -p /tmp/selfcheck
          javac -d /tmp/selfcheck $(find src/main/java/kneemoaks/model -name '*.java') src/test/java/kneemoaks/SelfCheck.java
          java -cp /tmp/selfcheck kneemoaks.SelfCheck

      - name: Draw the panel previews
        working-directory: plugin
        run: |
          mkdir -p /tmp/preview-classes
          javac -d /tmp/preview-classes $(find src/main/java/kneemoaks/model src/main/java/kneemoaks/ui src/test/java -name '*.java')
          java -Djava.awt.headless=true -cp /tmp/preview-classes kneemoaks.Preview preview

      - name: Stamp the build number
        working-directory: plugin
        run: |
          mkdir -p src/main/resources/kneemoaks
          echo "build=${GITHUB_RUN_NUMBER}" > src/main/resources/kneemoaks/build.properties
          echo "commit=${GITHUB_SHA::7}" >> src/main/resources/kneemoaks/build.properties

      - name: Build the plugin
        working-directory: plugin
        run: mvn -B -ntp package -Drevision=${{ env.WEASIS_VERSION }} -Dchangelist=

      - name: Show the bundle manifest
        working-directory: plugin
        run: unzip -p target/weasis-knee-moaks-*.jar META-INF/MANIFEST.MF

      - name: Package the download
        working-directory: plugin
        run: |
          mkdir -p dist/weasis-knee-moaks-outline
          # A new file name for every build: Weasis reuses its cached copy of a plugin whose
          # file name it has seen before.
          cp target/weasis-knee-moaks-outline-*.jar "dist/weasis-knee-moaks-outline/weasis-knee-moaks-outline-b${GITHUB_RUN_NUMBER}.jar"
          cp install/Install-Knee-MOAKS-Outline.command install/README.txt dist/weasis-knee-moaks-outline/
          chmod +x dist/weasis-knee-moaks-outline/Install-Knee-MOAKS-Outline.command
          (cd dist && zip -r weasis-knee-moaks-outline.zip weasis-knee-moaks-outline)

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: weasis-knee-moaks-outline
          path: |
            plugin/dist/weasis-knee-moaks-outline.zip
            plugin/preview/*.png

      - name: Publish the download on the Releases page
        if: github.ref == 'refs/heads/outline'
        working-directory: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete outline-latest --yes --cleanup-tag || true
          gh release create outline-latest dist/weasis-knee-moaks-outline.zip \
            --target "${GITHUB_SHA}" \
            --title "Knee MOAKS Outline (experimental) for Weasis ${WEASIS_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --prerelease \
            --notes "Experimental version with smart outlines. Download weasis-knee-moaks-outline.zip, unzip it, then right-click Install-Knee-MOAKS-Outline.command and choose Open. The regular version is unchanged. Built from ${GITHUB_SHA::7}."
